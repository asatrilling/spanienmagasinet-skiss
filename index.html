<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spanien Magasinet – förslag på ny startsida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&amp;family=Jost:wght@300;400;500&amp;family=Pinyon+Script&amp;display=swap">
<style>
body{margin:0;background:#FCFBF8}
a{color:#1E272A}a:hover{color:#7A5C1E}
.sm{--kalk:#FCFBF8;--sand:#F2EDE4;--ink:#1E272A;--mute:#5F6968;--hav:#1F5F8B;--guld:#A98636;--guld-text:#7F6224;--guld-ljus:#D9BE7C;--line:#E4DED3;font-family:'Jost','Avenir Next',Arial,sans-serif;color:var(--ink);background:var(--kalk);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.sm *{box-sizing:border-box}
.sm h1,.sm h2,.sm h3{font-family:'Bodoni Moda','Didot',Georgia,serif;font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.sm p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.label{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--mute)}
.label.guld{color:var(--guld-text)}
.skrift{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;border-radius:999px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;text-decoration:none;white-space:nowrap;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn-guld{background:#8C6D28;color:#FFFFFF}.btn-guld:hover{background:#735920;color:#FFFFFF}
.btn-ljus{background:#FFFFFF;color:#1E272A}.btn-ljus:hover{background:#F2EDE4;color:#1E272A}
.btn-linje{color:#1E272A;box-shadow:inset 0 0 0 1px #1E272A}.btn-linje:hover{color:#1E272A;background:#F2EDE4}
.btn-linje-ljus{color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}.btn-linje-ljus:hover{color:#FFFFFF;background:rgba(255,255,255,.1)}
.lank{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--guld);padding:12px 0 3px}
.koncept{background:#1E272A;color:#FCFBF8;font-size:13px;text-align:center;padding:7px 16px;letter-spacing:.06em}
.topp{border-bottom:1px solid var(--line);background:var(--kalk)}
.logo-rad{display:flex;align-items:flex-end;gap:28px;padding:30px 0 16px}
.logo-rad .logo{order:1;margin-right:auto;margin-top:0;margin-left:calc(-1 * min(160px, max(0px, (100vw - 1240px) / 2 + 24px)))}
@media (max-width:640px){.logo-rad .logo{margin-left:-4px}.logo-rad{gap:10px;padding-top:20px}.sm .logo-rad .logo{font-size:48px}.logo-rad .hoger .btn{padding:0 14px !important;font-size:11px;letter-spacing:.12em;min-height:40px !important}}
.logo-rad .vanster{order:2}
.logo-rad .hoger{order:3;margin-bottom:32px;margin-right:calc(-1 * min(160px, max(0px, (100vw - 1240px) / 2 + 8px)))}
.vanster{display:flex;gap:22px}
.vanster a,.hoger .in{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:12px 0}
.hoger{display:flex;justify-content:flex-end;gap:22px;align-items:center;align-self:center;order:3}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:var(--ink);font-size:140px;line-height:1;white-space:nowrap}
.logo:hover{color:var(--ink)}
.logo-tag{font-family:'Jost',sans-serif;font-size:.16em;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:0 0 .5em .1em}
.logo-ord{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;font-size:1.32em;color:#D9822B;line-height:.82;letter-spacing:-.005em}
.logo-mag{font-family:'Jost',sans-serif;font-weight:400;font-size:.22em;letter-spacing:.42em;text-transform:uppercase;color:var(--ink);margin:-.05em 0 0 4.2em}
.logo-fot{font-size:86px;margin:0}
.logo-fot .logo-tag{color:#A8A69E}.logo-fot .logo-ord{color:#F2B25C}.logo-fot .logo-mag{color:#F4EFE6}
.enye{position:relative;display:inline-block}
.tilde{position:absolute;left:50%;top:.1em;width:.43em;height:.19em;margin-left:-.215em;overflow:visible}
.meny{display:flex;justify-content:center;gap:26px;padding:30px 0 18px;flex-wrap:nowrap;white-space:nowrap}
.sm .meny a{letter-spacing:.12em}
@media (max-width:1240px){.sm .meny a{font-size:14px}.meny{gap:20px}}
@media (max-width:1100px){.sm .meny a{font-size:12px}}
.meny a{font-size:16px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--ink);padding:8px 0 4px;border-bottom:1px solid transparent}
.meny a:hover{border-color:var(--guld);color:var(--ink)}
.meny a.jul{color:#8A1C2B}.meny a.jul:hover{border-color:#8A1C2B;color:#8A1C2B}
.hero{position:relative;margin-top:0;overflow:hidden;height:clamp(640px,74vh,880px)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;animation:andas 18s ease-in-out infinite alternate}
@keyframes andas{from{transform:scale(1)}to{transform:scale(1.05)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,21,23,0) 40%,rgba(14,21,23,.28) 65%,rgba(14,21,23,.7) 100%),linear-gradient(90deg,rgba(14,21,23,.28),rgba(14,21,23,0) 55%)}
.hero-text{position:absolute;left:0;right:0;bottom:0;padding:56px max(56px, calc((100vw - 1240px) / 2 + 32px)) 64px;color:#FFFFFF;display:flex;flex-direction:column;gap:14px}
.hero-text h1,.hero-text p,.hero-text .skrift{text-shadow:0 2px 24px rgba(0,0,0,.35)}
.sektion{padding:110px 0}
.sek-huvud{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.reportage{display:grid;grid-template-columns:1.35fr 1fr;gap:40px}
.rep{display:flex;flex-direction:column;gap:16px;text-decoration:none;color:var(--ink)}
.rep:hover{color:var(--ink)}
.rep .bild{overflow:hidden;border-radius:2px;box-shadow:0 18px 40px -22px rgba(30,39,42,.45);transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s}
.rep:hover .bild{transform:translateY(-6px);box-shadow:0 34px 60px -26px rgba(30,39,42,.55)}
.smal .ram{position:relative;overflow:hidden;border-radius:2px;box-shadow:0 16px 34px -20px rgba(30,39,42,.45);transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s}
.smal:hover .ram{transform:translateY(-6px);box-shadow:0 30px 52px -24px rgba(30,39,42,.55)}
.smal .ram img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.smal:hover .ram img{transform:scale(1.05)}
.rep .bild{position:relative}
.las{position:absolute;left:50%;top:50%;width:120px;height:54px;margin:-27px 0 0 -60px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6) rotate(-6deg);transition:opacity .45s,transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.las-tilde{width:100%;height:100%;overflow:visible}
.rep:hover .las,.smal:hover .las,.rep:focus-visible .las,.smal:focus-visible .las{opacity:1;transform:scale(1) rotate(0)}
.rep h3,.smal h3{background:linear-gradient(#A98636,#A98636) 0 100%/0 1px no-repeat;transition:background-size .6s cubic-bezier(.2,.7,.2,1);display:inline;padding-bottom:2px}
.rep:hover h3,.smal:hover h3,.rep:focus-visible h3,.smal:focus-visible h3{background-size:100% 1px}
.vidare{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7F6224;font-weight:500;margin-top:2px}
.vidare i{font-style:normal;display:inline-block;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.rep:hover .vidare i,.smal:hover .vidare i,.rep:focus-visible .vidare i,.smal:focus-visible .vidare i{transform:translateX(8px)}
.rep:focus-visible,.smal:focus-visible{outline:2px solid #A98636;outline-offset:6px}
.rep .bild img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.rep:hover .bild img{transform:scale(1.04)}
.rep .rad{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rep p{color:var(--mute)}
.smala{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:56px}
.smal{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:2px solid var(--ink);text-decoration:none;color:var(--ink)}
.smal:hover h3{color:var(--hav)}
.smal img{width:100%;height:220px;object-fit:cover;display:block;border-radius:2px}
.citat{background:#1E272A;color:#F4EFE6;text-align:center;padding:120px 0}
.citat-bild{position:relative;height:620px;overflow:hidden;color:#FFFFFF}
.citat-bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.citat-bild .slöja{position:absolute;inset:0;background:rgba(14,21,23,.38)}
.rand{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.spar{display:flex;gap:18px;width:max-content;animation:snurra 60s linear infinite}
.rand:hover .spar,.rand:focus-within .spar{animation-play-state:paused}
@keyframes snurra{to{transform:translateX(calc(-50% - 9px))}}
.tema{position:relative;display:block;flex:none;width:320px;height:440px;overflow:hidden;border-radius:2px;background:var(--kalk);text-decoration:none}
.tema .sponsrad{position:absolute;left:14px;top:14px;padding:5px 11px;border-radius:999px;background:rgba(252,251,248,.92);color:#1E272A;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.annons-markering{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.billboard{display:grid;grid-template-columns:1.1fr 1fr;min-height:300px;border-radius:4px;overflow:hidden;background:var(--sand);text-decoration:none;color:var(--ink)}
.billboard:hover{color:var(--ink)}
.billboard img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block}
.annonsbricka{position:absolute;left:12px;top:12px;background:var(--kalk);color:var(--ink);font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.format-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.format{border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF}
.format p{color:var(--mute);font-size:15px}
.fpris{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.fpris b{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:26px}
.fpris span{font-size:13px;color:var(--mute)}
.siffror{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px;align-items:end}
.siffra b{display:block;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:46px;line-height:1;color:#B8741F}
.siffra span{font-size:14px;color:var(--mute)}
@media (prefers-reduced-motion: reduce){.spar{animation:none}.rand{overflow-x:auto}}
.format.vald{border-color:#8C6D28;box-shadow:inset 0 0 0 1px #8C6D28}
.format button{cursor:pointer;border:0}
.bokning{margin-top:36px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;box-shadow:0 40px 80px -50px rgba(30,39,42,.45);overflow:hidden;scroll-margin-top:24px}
.bok-topp{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:26px 32px 18px;border-bottom:1px solid var(--line)}
.stang{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#FFFFFF;color:#5F6968;font-size:24px;line-height:1;cursor:pointer}
.stegrad{display:flex;gap:6px;margin-top:16px}
.stegdel{flex:1;height:3px;border-radius:3px;background:var(--line)}
.stegdel.gjord{background:#A98636}
.bok-kropp{padding:28px 32px;display:flex;flex-direction:column;gap:16px}
.pillgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.val{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#FFFFFF;color:#1E272A;font:inherit;cursor:pointer;min-height:56px}
.val b{display:block;font-weight:500}
.val small{display:block;color:#5F6968;font-size:13px;line-height:1.4}
.val .p{font-family:'Bodoni Moda',Georgia,serif;font-size:18px;white-space:nowrap}
.val.vald{border-color:#8C6D28;background:#FBF3E0;box-shadow:inset 0 0 0 1px #8C6D28}
.pillgrid .val{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.tips{font-size:14px;color:#7F6224}
.uppladd{display:flex;flex-direction:column;gap:10px;border:1.5px dashed #CDBEA4;border-radius:8px;padding:22px;text-align:center;color:#5F6968;font-size:15px;background:#FBF8F2;cursor:pointer}
.uppladd input{align-self:center;max-width:100%;font:inherit;font-size:14px}
.falt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.falt-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#5F6968}
.falt-grid label.hel{grid-column:1/-1}
.falt-grid input{font:inherit;font-size:16px;color:#1E272A;background:#FFFFFF;border:1px solid #D9D2C4;border-radius:6px;padding:12px 14px;min-height:46px}
.falt-grid input:focus-visible,.val:focus-visible,.stang:focus-visible,.btn:focus-visible{outline:2px solid #A98636;outline-offset:2px}
.oversikt{border:1px solid var(--line);border-radius:8px}
.orad{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.orad span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.orad.total{border-bottom:0;font-weight:500;font-size:17px}
.betgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trygg{font-size:13px;color:#5F6968}
.fel{color:#9C3D1E;font-size:14px}
.bok-fot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 32px;border-top:1px solid var(--line);background:#FCFBF8}
.summa{font-size:13px;color:#5F6968}
.summa b{display:block;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:26px;color:#1E272A}
.klart{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.klart .ring{width:68px;height:68px;border-radius:50%;background:#FBF3E0;color:#8C6D28;display:flex;align-items:center;justify-content:center}
.klart .nr{font-family:'Bodoni Moda',Georgia,serif;font-size:20px;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:6px 20px}
@media (max-width:760px){.pillgrid,.betgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.falt-grid{grid-template-columns:1fr}.bok-topp,.bok-kropp,.bok-fot{padding-left:18px;padding-right:18px}}
.tema img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tema:hover img{transform:scale(1.05)}
.tema span{position:absolute;left:0;right:0;bottom:0;padding:70px 22px 24px;color:#FFFFFF;background:linear-gradient(180deg,rgba(14,21,23,0),rgba(14,21,23,.75))}
.tema b{display:block;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:26px;line-height:1.1}
.tema small{display:block;margin-top:6px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#E6CF96}
.hej-bild{position:relative;min-height:780px;overflow:hidden;display:flex;align-items:center}
.hej-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:80% 40%}
.hej-bild::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,21,23,.28),rgba(14,21,23,0) 60%);pointer-events:none}
.hej-inne{position:relative;z-index:1;width:100%;padding-top:130px;padding-bottom:90px}
.hej-kort{position:relative;max-width:540px;background:rgba(252,251,248,.95);border-radius:4px;padding:120px 48px 44px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 80px -40px rgba(0,0,0,.55)}
.hej-portratt{position:absolute;top:-110px;left:44px;width:210px;height:210px;border-radius:50%;padding:8px;background:#FCFBF8;border:1px solid #C9A227;box-shadow:0 24px 48px -24px rgba(0,0,0,.5)}
@media (max-width:640px){.hej-kort{padding:96px 22px 30px}.hej-portratt{width:160px;height:160px;top:-80px;left:22px}.hej-inne{padding-top:110px}}
.hej{display:grid;grid-template-columns:1fr 1.1fr;gap:80px;align-items:center}
.hej img{width:100%;max-width:440px;aspect-ratio:1;justify-self:center;border-radius:50%;padding:10px;border:1px solid #C9A227;box-shadow:0 30px 60px -34px rgba(30,39,42,.5)}
.hej{grid-template-columns:1fr 1.1fr}
.lasare{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.lasare figure{margin:0;display:flex;flex-direction:column;gap:16px;padding-top:22px;border-top:1px solid var(--guld)}
.gava{background:#2A0A10;color:#F4EFE6}
.gava-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.gava-grid img{width:100%;max-width:520px;justify-self:center;border-radius:2px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.numret{background:var(--sand)}
.numret-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:80px;align-items:center}
.omslag{position:relative;height:540px}
.omslag img{position:absolute;width:52%;border-radius:2px;box-shadow:0 30px 50px -28px rgba(0,0,0,.55);transition:transform .5s}
.omslag .o1{left:2%;top:9%;transform:rotate(-6deg)}
.omslag .o2{left:44%;top:6%;transform:rotate(5deg)}
.omslag:hover .o1{transform:rotate(-9deg) translateX(-10px)}
.omslag:hover .o2{transform:rotate(8deg) translateX(10px)}
.planer{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 22px}
.plan{border:1px solid var(--line);border-radius:4px;padding:22px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px}
.plan.vald{border-color:#8C6D28;box-shadow:inset 0 0 0 1px #8C6D28}
button.plan{font:inherit;color:#1E272A;text-align:left;cursor:pointer;transition:transform .3s,box-shadow .3s,border-color .3s}
button.plan:hover{transform:translateY(-3px);border-color:#8C6D28;box-shadow:0 18px 36px -22px rgba(30,39,42,.45)}
button.plan:focus-visible{outline:2px solid #A98636;outline-offset:3px}
.plan-ga{margin-top:6px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:#7F6224}
.plan-ga i{font-style:normal;display:inline-block;transition:transform .3s}
button.plan:hover .plan-ga i{transform:translateX(6px)}
.plan b{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:40px;line-height:1}
.betal{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.betal span{font-size:12px;letter-spacing:.06em;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#FFFFFF;color:var(--ink)}
.partner-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.partner{height:96px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;letter-spacing:.08em}
.fot{background:#1E272A;color:#CFC9BE;font-size:15px}
.fot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.fot h4{font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#D9BE7C;margin:0 0 14px}
.fot a{display:block;color:#CFC9BE;text-decoration:none;padding:5px 0}.fot a:hover{color:#FFFFFF}
@media (prefers-reduced-motion: reduce){.hero img{animation:none}}
@media (max-width:1000px){
.vanster,.hoger .in{display:none}
.reportage,.hej,.gava-grid,.numret-grid{grid-template-columns:1fr;gap:44px}
.smala,.lasare{grid-template-columns:1fr}
.tema{width:240px;height:330px}
.billboard{grid-template-columns:1fr}.billboard img{height:240px}
.format-grid{grid-template-columns:1fr 1fr}
.siffror{grid-template-columns:1fr 1fr}.siffror > :first-child{grid-column:1/-1}
.partner-grid{grid-template-columns:repeat(2,1fr)}

    function kSatt(n) { return function (e) { var k = Object.assign({}, self.state.k); k[n] = e.target.value; self.setState({ k: k, kFel: '' }); }; }
    function satt(k) { return function (e) { var f = Object.assign({}, self.state.f); f[k] = e.target.value; self.setState({ f: f, fel: '' }); }; }
    var boSvar = s.bo, antal = Object.keys(boSvar).length;
    function boLista(q) { return FRAGOR[q].map(function (o) { var v = boSvar[q] === o.id; return { t: o.t, vald: v, klass: v ? 'val vald' : 'val', pick: function () { var b = Object.assign({}, self.state.bo); b[q] = o.id; self.setState({ bo: b }); } }; }); }
    var poang = { sol: 0, blanca: 0, mallorca: 0, kanarie: 0 };
    Object.keys(boSvar).forEach(function (q) { var o = FRAGOR[q].filter(function (x) { return x.id === boSvar[q]; })[0]; Object.keys(o.p).forEach(function (r) { poang[r] += o.p[r]; }); });
    var bast = ['sol', 'blanca', 'mallorca', 'kanarie'].reduce(function (a, b) { return poang[b] > poang[a] ? b : a; }, 'sol');
    var bo = Object.assign({}, BO[bast], { klar: antal === 5, tom: antal < 5, matare: 'width:' + (antal * 20) + '%', kvar: antal === 0 ? 'Fem frågor kvar' : (5 - antal === 1 ? 'En fråga kvar' : (5 - antal) + ' frågor kvar') });
    return {
      q1: boLista('q1'), q2: boLista('q2'), q3: boLista('q3'), q4: boLista('q4'), q5: boLista('q5'), bo: bo,
      meddelanden: s.meddelanden.map(function (m) { return { klass: m.fran === 'lola' ? 'msg lola' : 'msg du', lola: m.fran === 'lola', text: m.text, harLank: !!m.l1, har2: !!m.l2, l1: m.l1 || { t: '', href: '#' }, l2: m.l2 || { t: '', href: '#' } }; }),
      skriver: s.skriver, chattText: s.chattText,
      chips: LOLA_CHIPS.map(function (c) { return { t: c, valj: function () { self.lolaFraga(c); } }; }),
      chattSkriv: function (e) { self.setState({ chattText: e.target.value }); },
      chattSkicka: function () { self.lolaFraga(self.state.chattText); },
      vb: { form: !s.vbKlar, klar: s.vbKlar, epost: s.vbEpost, harFel: !!s.vbFel, fel: s.vbFel },
      vbSkriv: function (e) { self.setState({ vbEpost: e.target.value, vbFel: '' }); },
      vbAnmal: function () { var e = (self.state.vbEpost || '').trim(); if (e.indexOf('@') < 1 || e.indexOf('.') < 0) { self.setState({ vbFel: 'Skriv en giltig e-postadress.' }); return; } self.setState({ vbKlar: true, vbFel: '' }); },
      boOm: function () { self.setState({ bo: {}, mkKlar: false, mkFel: '' }); },
      mk: { form: !s.mkKlar, klar: s.mkKlar, epost: s.mkEpost, ok: s.mkOk, bock: s.mkOk ? '✓' : '', harFel: !!s.mkFel, fel: s.mkFel,
        budgetar: MK_BUDGET.map(function (t) { var v = s.mkBudget === t; return { t: t, vald: v, klass: v ? 'vald' : '', pick: function () { self.setState({ mkBudget: t, mkFel: '' }); } }; }) },
      mkSkriv: function (e) { self.setState({ mkEpost: e.target.value, mkFel: '' }); },
      mkSamtycke: function () { self.setState({ mkOk: !self.state.mkOk, mkFel: '' }); },
      mkSkicka: function () { var st = self.state, e = (st.mkEpost || '').trim(); if (e.indexOf('@') < 1 || e.indexOf('.') < 0) { self.setState({ mkFel: 'Skriv en giltig e-postadress.' }); return; } if (!st.mkBudget) { self.setState({ mkFel: 'Välj ungefärlig budget.' }); return; } if (!st.mkOk) { self.setState({ mkFel: 'Bocka i samtycket så att vi får dela dina uppgifter med mäklaren.' }); return; } self.setState({ mkKlar: true, mkFel: '' }); },
      hjFilter: HJALP_KAT.map(function (t) { var v = s.hjKat === t; return { t: t, vald: v, klass: v ? 'vald' : '', pick: function () { self.setState({ hjKat: t }); } }; }),
      hjLista: HJALP.filter(function (h) { return s.hjKat === 'Alla' || h.kat === s.hjKat; }),
      rs: { form: !s.rsKlar, klar: s.rsKlar, epost: s.rsEpost, resa: s.rsResa, harFel: !!s.rsFel, fel: s.rsFel },
      rsValj: function (e) { self.setState({ rsResa: e.target.value }); },
      rsSkriv: function (e) { self.setState({ rsEpost: e.target.value, rsFel: '' }); },
      rsAnmal: function () { var e = (self.state.rsEpost || '').trim(); if (e.indexOf('@') < 1 || e.indexOf('.') < 0) { self.setState({ rsFel: 'Skriv en giltig e-postadress.' }); return; } self.setState({ rsKlar: true, rsFel: '' }); },
      format: format, oppen: s.oppen, valt: v, perioder: perioder, betalsatt: betalsatt, rader: rader, f: s.f, prod: s.prod, nr: s.nr,
      satt: { ftg: satt('ftg'), org: satt('org'), namn: satt('namn'), tel: satt('tel'), epost: satt('epost'), lank: satt('lank') },
      s1: s.steg === 1, s2: s.steg === 2, s3: s.steg === 3, s4: s.steg === 4, s5: s.steg === 5,
      visaSteg: s.steg < 5, visaBak: s.steg > 1 && s.steg < 5,
      stegLista: STEGNAMN.map(function (n, i) { return { klass: i < s.steg ? 'stegdel gjord' : 'stegdel' }; }),
      stegNamn: s.steg < 5 ? 'Steg ' + s.steg + ' av 4 · ' + STEGNAMN[s.steg - 1] : '',
      valjText: v.typ === 'tryck' ? 'Välj ett eller flera nummer av tidningen.' : (v.typ === 'webb' ? 'Välj en eller flera månader.' : 'Välj ett eller flera utskick.'),
      filText: s.fil ? 'Vald fil: ' + s.fil : 'PDF, JPG, PNG eller ZIP',
      prodKlass: s.prod ? 'val vald' : 'val',
      onFil: function (e) { var fl = e.target.files && e.target.files[0]; self.setState({ fil: fl ? fl.name : '', fel: '' }); },
      togglaProd: function () { self.setState({ prod: !self.state.prod, fel: '' }); },
      harFel: !!s.fel, fel: s.fel,
      summaEtikett: s.steg === 5 ? 'Bokningen är klar' : (p.n ? 'Att betala inkl. moms' : 'Pris exkl. moms'),
      summaText: s.steg === 5 ? kr(p.tot) : (p.n ? kr(p.tot) : kr(v.pris) + ' per ' + v.enhet),
      nastaText: s.steg === 4 ? (s.bet === 'faktura' ? 'Boka mot faktura' : 'Betala ' + kr(p.tot) + ' med ' + betNamn) : (s.steg === 5 ? 'Stäng' : 'Fortsätt'),
      klartText: (s.bet === 'faktura' ? 'Fakturan skickas till ' + (s.f.epost || 'er e-post') + '.' : 'Betalningen med ' + betNamn + ' är genomförd.') + ' Kvitto och bokningsbekräftelse kommer per e-post. ' + (s.prod ? 'Vår formgivare skickar ett korrektur inom två arbetsdagar.' : 'Vi granskar materialet och hör av oss om något behöver justeras.'),
      nasta: function () { self.nasta(); },
      bak: function () { self.setState({ steg: Math.max(1, self.state.steg - 1), fel: '' }); },
      stang: function () { self.setState({ oppen: false }); },
      pk: { digital: s.plan === 'digital' ? 'plan vald' : 'plan', tryck: s.plan === 'tryck' ? 'plan vald' : 'plan', digitalVald: s.plan === 'digital', tryckVald: s.plan === 'tryck' },
      valjDigital: function () { self.oppnaKassa('digital'); },
      valjTryck: function () { self.oppnaKassa('tryck'); },
      kassaOppen: !!s.plan,
      kassa: {
        rubrik: s.plan === 'tryck' ? 'Tryckt prenumeration, ett år' : 'Digital prenumeration, ett år',
        pris: s.plan === 'tryck' ? '490 kr' : '195 kr', tryck: s.plan === 'tryck',
        formular: s.kSteg === 1, klar: s.kSteg === 2, harFel: !!s.kFel, fel: s.kFel,
        knapp: 'Betala ' + (s.plan === 'tryck' ? '490 kr' : '195 kr') + ' med ' + KBETAL.filter(function (x) { return x.id === s.kBet; })[0].t,
        klarText: 'Betalningen med ' + (s.kMetod || 'kort') + ' är klar. ' + (s.plan === 'tryck' ? 'Första numret kommer hem i brevlådan, och ett kvitto skickas till ' + (s.k.epost || 'din e-post') + '.' : 'Inloggningen till den digitala tidningen skickas till ' + (s.k.epost || 'din e-post') + '.')
      },
      k: s.k,
      kSatt: { namn: kSatt('namn'), epost: kSatt('epost'), adress: kSatt('adress'), postnr: kSatt('postnr'), ort: kSatt('ort') },
      kBetal: KBETAL.map(function (x) { var v = s.kBet === x.id; return { t: x.t, u: x.u, vald: v, klass: v ? 'val vald' : 'val', pick: function () { self.setState({ kBet: x.id, kFel: '' }); } }; }),
      snabb: [{ t: 'Apple Pay' }, { t: 'Google Pay' }, { t: 'Klarna' }].map(function (x) { return { t: x.t, betala: function () { self.setState({ kSteg: 2, kMetod: x.t, kFel: '' }); } }; }),
      betalaKassa: function () {
        var k = self.state.k, tr = self.state.plan === 'tryck';
        if (!k.namn || k.epost.indexOf('@') < 1 || (tr && (!k.adress || !k.postnr || !k.ort))) { self.setState({ kFel: tr ? 'Fyll i namn, e-post och adress så vi vet vart tidningen ska.' : 'Fyll i namn och e-post.' }); return; }
        self.setState({ kSteg: 2, kMetod: KBETAL.filter(function (x) { return x.id === self.state.kBet; })[0].t, kFel: '' });
      },
      stangKassa: function () { self.setState({ plan: '', kSteg: 1, kFel: '' }); }
    };
  }
}
